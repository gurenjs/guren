name: Change

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  change:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The record names the pull request's own head, never GitHub's merge commit (RFC 0040 §8).
      BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.HEAD }}
          # The change is read from the merge base of BASE and HEAD, which a shallow clone does not hold.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs the gate as `bunx guren gate --deps` does and fails exactly when it does. Everything
      # else it could not establish is a hold in the evidence, never a failed build. Drop --deps,
      # here and in ci.yml, if this runner cannot reach the npm registry.
      - name: Change evidence
        run: bunx guren change:evidence --base "$BASE" --head "$HEAD" --deps

      - name: Summary
        if: ${{ !cancelled() && hashFiles('.guren/evidence/evidence.md') != '' }}
        run: cat .guren/evidence/evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record
        if: ${{ !cancelled() && hashFiles('.guren/evidence/record.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: guren-record-${{ env.HEAD }}
          path: .guren/evidence/record.json
          # The record is the base later changes are compared with; keep it as long as the repository allows.
          retention-days: 90
          overwrite: true
