services:
  postgres:
    image: postgres:17
    container_name: guren-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: guren
      POSTGRES_USER: guren
      POSTGRES_PASSWORD: guren
    ports:
      - "54322:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guren -d guren"]
      interval: 5s
      retries: 10
      start_period: 5s
      timeout: 3s

  # Port and credentials match what `create-guren-app --db mysql` scaffolds, so
  # MYSQL_URL is the same string in a fresh app and in the ORM integration test.
  mysql:
    image: mysql:8.4
    container_name: guren-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: guren
      MYSQL_USER: guren
      MYSQL_PASSWORD: guren
      MYSQL_DATABASE: guren
    ports:
      - "33306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uguren -pguren"]
      interval: 5s
      retries: 20
      start_period: 20s
      timeout: 3s

volumes:
  postgres_data:
  mysql_data:
