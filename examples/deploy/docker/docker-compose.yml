services:
  app:
    build: .
    ports:
      - "3333:3333"
    environment:
      DATABASE_URL: postgres://guren:guren@postgres:5432/guren
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: guren
      POSTGRES_PASSWORD: guren
      POSTGRES_DB: guren
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U guren
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
