name: Nightly Canary

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  canary-validate:
    runs-on: ubuntu-latest
    # Measured max 6m0s. Generous for the same reason as the release gate:
    # it is a superset of CI, builds from scratch every night, and adds the
    # deploy-bundle probes and benchmarks on top.
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17-alpine
        ports:
          - 54322:5432
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgres://guren:guren@localhost:54322/guren
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      # ----------------------------------------------------------------
      # Nightly canary is a SUPERSET of CI.
      # Every check that CI runs MUST also run here. Additional
      # canary-specific checks (e.g. extended smoke tests, upgrade
      # scenarios) are appended after the CI-equivalent steps.
      # When adding a new step to ci.yml, mirror it here as well.
      # Exception: CI's dist-cache/build-skip steps are deliberately NOT
      # mirrored — the canary always builds from scratch, so it stays the
      # ground truth that would catch a poisoned or stale cache.
      # ----------------------------------------------------------------

      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      # -- Audit checks (matching CI) --

      - name: Core-first audit
        run: bun run audit:core-first

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      - name: Template dependency audit
        run: bun run audit:template-deps

      # Its whole verdict rests on Bun.semver range evaluation, so the canary
      # run is where a Bun-side change to that would surface.
      - name: Plugin compatibility audit
        run: bun run audit:plugin-compat

      - name: Docs audit
        run: bun run audit:docs

      # Advisories appear without any code change, so the nightly run is the
      # one that catches them between PRs.
      - name: Dependency audit
        run: bun run audit:deps

      # -- Example app builds (matching CI) --

      - name: Build example apps
        run: |
          bun run --cwd examples/blog build
          bun run --cwd web build

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      # -- Smoke tests (matching CI) --

      - name: Fresh app smoke (default)
        run: bun run smoke:starter

      - name: Fresh app smoke (api)
        run: bun run smoke:starter:api

      - name: Fresh app smoke (worker)
        run: bun run smoke:starter:worker

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      - name: Upgrade existing app smoke
        run: bun run smoke:upgrade-existing-app

      - name: Golden path smoke test
        run: bun run smoke:golden-path

      # -- Tests --

      - name: Run tests
        run: bun run test

      # -- Deploy bundle gates (nightly only) --

      # These four tests are opt-in, and until now ran nowhere: no workflow
      # set either variable, so all three deploy plugins shipped their bundle
      # gates switched off. They cover an app failing to bundle on a database
      # it never chose, which reached users twice because nothing in the repo
      # bundled a real app.
      #
      # Nightly rather than PR CI: each probe installs @guren/orm from a
      # tarball plus its clients from npm, and `bunx wrangler` resolves the
      # latest release rather than the version this repo pins. An upstream
      # publish can therefore turn these red with no change here — a canary
      # signal, not a reason to block a merge.
      - name: Deploy bundle gates
        run: bun run test:bun plugin-cloudflare plugin-lambda plugin-vercel
        env:
          GUREN_TEST_WRANGLER: '1'
          GUREN_TEST_BUNDLE: '1'

      # -- Benchmarks (nightly only) --

      - name: Run benchmarks
        run: bun run bench

  e2e:
    runs-on: ubuntu-latest
    # Measured max 6m48s — higher than CI's e2e because this one installs
    # the Playwright browsers unconditionally, with no cache to hit.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 54322:5432
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://guren:guren@localhost:54322/guren
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Build blog frontend
        run: bun run --cwd examples/blog build

      - name: Install Playwright browsers
        run: cd examples/blog && bunx playwright install --with-deps chromium

      - name: Set up blog .env
        run: |
          cp examples/blog/.env.example examples/blog/.env
          sed -i "s/^APP_KEY=$/APP_KEY=$APP_KEY/" examples/blog/.env
          sed -i "/^VITE_DEV_SERVER_URL=/d" examples/blog/.env

      - name: Run migrations and seed
        working-directory: examples/blog
        run: |
          bun ../../packages/cli/src/bin.ts db:migrate
          bun ../../packages/cli/src/bin.ts db:seed --force

      - name: Run E2E tests
        env:
          NODE_ENV: production
        run: bun run --cwd examples/blog e2e

  web-app:
    runs-on: ubuntu-latest
    # Measured max 2m36s.
    timeout-minutes: 20

    steps:
      # ----------------------------------------------------------------
      # Mirrors the web-app job from CI to ensure the docs site builds
      # and passes all checks on the nightly schedule as well.
      # ----------------------------------------------------------------

      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: |
          bun run --cwd web routes:types
          git diff --exit-code -- web/types/generated/routes.d.ts

      - name: Type check
        run: bun run --cwd web typecheck

      - name: Run tests
        run: bun run --cwd web test

      - name: Build client and SSR
        run: bun run --cwd web build

      - name: Bundle budget audit
        run: bun run ./scripts/smoke/build-budget.ts --max-kb 600 web
