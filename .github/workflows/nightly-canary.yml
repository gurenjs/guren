name: Nightly Canary

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  canary-validate:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.1'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Full validation
        run: bun run build && bun run typecheck && bun run test

      - name: Starter smoke
        run: bun run smoke:starter

      - name: Packed starter smoke
        run: bun run smoke:starter:packed
