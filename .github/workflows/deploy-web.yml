# Deploys guren.dev to Cloudflare Workers on every main push that can change
# the site: the app itself (web/), the docs it serves from the repo root
# (docs/), the workspace packages the worker bundle inlines (packages/), and
# the blog example, whose docs bundle is published as the static docs-viewer
# snapshot at /_guren/docs (web/scripts/prerender-docs-viewer.ts). The graph
# covers the example's source files too, not only its docs/, so the whole
# directory triggers a rebuild.
#
# Safe on a public repo: secrets are never exposed to workflows triggered
# from fork pull requests, and this only runs on push to main. The API token
# should be scoped to this account's "Workers Scripts: Edit" and "D1: Edit"
# permissions only. Required secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy guren.dev

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'examples/blog/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Queue deploys instead of overlapping; never cancel one mid-flight.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The worker bundle inlines the workspace packages' dist/ output.
      - name: Build packages
        run: bun run build

      # Also builds the docs search index, which the deploy needs: wrangler
      # bundles src/app.ts itself, so the table names reach the Worker from
      # .guren/search-index.gen.ts when `wrangler deploy` runs, not earlier.
      - name: Build worker
        run: bun run --cwd web cloudflare:build

      # Idempotent: only unapplied migrations run. Before deploy so new code
      # never runs against an old schema.
      - name: Apply D1 migrations
        run: cd web && bunx wrangler d1 migrations apply guren-web --remote

      # Before the new index lands, and keyed on the build D1 currently
      # records — which is the one the Worker serving the site right now was
      # deployed with. Two builds therefore coexist between deploys, so
      # `wrangler rollback` still has its tables.
      - name: Retire superseded search tables
        run: cd web && bun run search:prune

      # Skips when the corpus is unchanged, which is most deploys. Reindexing
      # every time would exceed D1's free write budget on a busy day.
      - name: Load the docs search index
        run: cd web && bun run search:apply

      - name: Deploy
        run: cd web && bunx wrangler deploy
