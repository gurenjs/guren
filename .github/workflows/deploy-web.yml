# Deploys guren.dev to Cloudflare Workers on every main push that can change
# the site: the app itself (web/), the docs it serves from the repo root
# (docs/), the workspace packages the worker bundle inlines (packages/), and
# the blog example, whose docs bundle is published as the static docs-viewer
# snapshot at /_guren/docs (web/scripts/prerender-docs-viewer.ts). The graph
# covers the example's source files too, not only its docs/, so the whole
# directory triggers a rebuild.
#
# Safe on a public repo: secrets are never exposed to workflows triggered
# from fork pull requests, and this only runs on push to main. The API token
# should be scoped to this account's "Workers Scripts: Edit" and "D1: Edit"
# permissions only. Required secrets: CLOUDFLARE_API_TOKEN,
# CLOUDFLARE_ACCOUNT_ID.
name: Deploy guren.dev

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - 'examples/blog/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# Queue deploys instead of overlapping; never cancel one mid-flight.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The worker bundle inlines the workspace packages' dist/ output.
      - name: Build packages
        run: bun run build

      # Also builds the docs search index, which the deploy needs: wrangler
      # bundles src/app.ts itself, so the table names reach the Worker from
      # .guren/search-index.gen.ts when `wrangler deploy` runs, not earlier.
      - name: Build worker
        run: bun run --cwd web cloudflare:build

      # wrangler's dry run on the assembled output, judged against the budget
      # in web/scripts/lib/bundle-size.ts. Before the D1 steps: a bundle that
      # will not be deployed must not have loaded a search index first.
      - name: Check worker bundle size
        run: cd web && bun run bundle:check

      # RFC 0032 M5: the runtime error collector and @guren/cli (the Dev
      # Center behind GUREN_MCP=1) must not reach the Worker. Judged from the
      # bundle's inputs, so it fails before anything touches D1.
      - name: Check development-only code is not bundled
        run: cd web && bun run dev-only:check

      # Idempotent: only unapplied migrations run. Before deploy so new code
      # never runs against an old schema.
      - name: Apply D1 migrations
        run: cd web && bunx wrangler d1 migrations apply guren-web --remote

      # Skips when the corpus is unchanged, which is most deploys. Reindexing
      # every time would exceed D1's free write budget on a busy day. A
      # changed corpus does import ~4 MB here, and D1 does not serve the
      # database while an import runs — the site's other D1 routes stall for
      # those seconds too. The import is atomic, which is worth that.
      - name: Load the docs search index
        run: cd web && bun run search:apply

      - name: Deploy
        run: cd web && bunx wrangler deploy

      # Only on the success path: the state row records what has been loaded,
      # not what is live, so a deploy that failed at the step above would have
      # this delete the tables the still-live Worker is naming. Keeps two
      # builds, because `wrangler rollback` brings back an earlier Worker and
      # not an earlier database.
      - name: Retire superseded search tables
        run: cd web && bun run search:prune

      # The live site, read-only: the development endpoints answer 404 and the
      # home page 200. Last, so a failure reports without skipping the prune;
      # it does not roll back.
      - name: Check development endpoints on the live site
        run: cd web && bun run endpoints:check
