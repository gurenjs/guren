name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Superseded runs of the same PR are cancelled; pushes to main always run to
# completion (each gets its own group via the commit SHA).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.14']
        include:
          - bun-version: '1.3.14'
            redis: true
          # When a new Bun version is supported, add it here:
          # - bun-version: '1.4.x'
          #   redis: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: guren
          MYSQL_USER: guren
          MYSQL_PASSWORD: guren
          MYSQL_DATABASE: guren
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uguren -pguren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REDIS_URL: redis://localhost:6379
      # Drives the ORM's MySQL integration test, which creates its own database.
      MYSQL_URL: mysql://root:guren@localhost:33306/guren
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # setup-bun + exact-match dist cache + install + build-on-miss.
      # The cache key and its stale-dist rationale live in the action.
      - name: Set up Bun and build packages
        uses: ./.github/actions/setup-and-build
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      - name: Core-first audit
        run: bun run audit:core-first

      # `guren` is not on npm: `bunx guren` in a workspace manifest 404s
      # whenever the local .bin link is missing. Template trees are exempt —
      # scaffolded apps install @guren/cli from npm and get a real bin.
      - name: Workspace scripts audit
        run: bun run audit:workspace-scripts

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      # Template @guren/* ranges resolve from npm, so a stale one only surfaces
      # in a real scaffold. This compares them to the workspace versions instead.
      - name: Template dependency audit
        run: bun run audit:template-deps

      # `gurenPlugin.compatibility` has no writer — changesets does not know the
      # field exists — so a published plugin can declare itself incompatible with
      # the core it ships beside while the workspace symlink keeps CI green.
      - name: Plugin compatibility audit
        run: bun run audit:plugin-compat

      - name: Docs audit
        run: bun run audit:docs

      - name: Dependency audit
        run: bun run audit:deps

      # --no-deps: the app-level scan would resolve the monorepo's root
      # lockfile and hit the registry on every PR; the root dependency gate
      # (audit:deps) already covers exactly that surface hermetically.
      - name: Security audit (blog example)
        run: cd examples/blog && bun ../../packages/cli/src/bin.ts audit --no-deps

      # Also the only cross-machine exercise of the spec views' determinism
      # contract: committed-on-macOS vs regenerated-on-ubuntu.
      - name: Spec drift (blog example)
        run: cd examples/blog && bun ../../packages/cli/src/bin.ts check --spec

      - name: Build example apps
        run: |
          bun run --cwd examples/blog build
          bun run --cwd web build

      # The plugin's unit tests build against synthetic fixtures; only a real
      # Vite build proves its manifest lookup still finds the asset paths.
      - name: Vercel build audit (example app)
        run: bun run ./scripts/smoke/vercel-build-audit.ts examples/blog

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      - name: Run tests
        run: bun run test

      - name: Testing package tests (vitest)
        run: bun run test:testing

  # Scaffolding smokes, split from build-and-test so the unit-test critical
  # path doesn't wait ~2 minutes for them. They rebuild the packages
  # themselves and run in parallel with everything else.
  starter-smokes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: guren
          MYSQL_USER: guren
          MYSQL_PASSWORD: guren
          MYSQL_DATABASE: guren
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -h127.0.0.1 -uguren -pguren"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun and build packages
        uses: ./.github/actions/setup-and-build

      - name: Fresh app smoke (default)
        run: bun run smoke:starter

      - name: Fresh app smoke (api)
        run: bun run smoke:starter:api

      - name: Fresh app smoke (blog)
        run: bun run smoke:starter:blog

      - name: Fresh app smoke (worker)
        run: bun run smoke:starter:worker

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      # Upgrade smoke temporarily skipped: template deps reference 1.0.0-rc.9
      # which is not yet on npm. Re-enable after first RC publish.
      # - name: Upgrade existing app smoke
      #   run: bun run smoke:upgrade-existing-app

      - name: Golden path smoke test
        run: bun run smoke:golden-path

      - name: Golden path smoke test (postgres)
        run: bun run smoke:golden-path:postgres

      # The only place a --db mysql scaffold is typechecked and migrated.
      - name: Golden path smoke test (mysql)
        run: bun run smoke:golden-path:mysql

  sqlite-smoke:
    runs-on: ubuntu-latest
    # No redis service — verifies all tests gracefully skip when Redis is
    # unavailable. Typecheck is deliberately absent: it is environment-
    # independent and already covered by build-and-test.
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun and build packages
        uses: ./.github/actions/setup-and-build
      - name: Generate route types
        run: bun run build:routes
      - name: Run tests (no Redis)
        run: bun run test:bun

  e2e:
    runs-on: ubuntu-latest
    # NODE_ENV=production is required for Vite asset serving.
    # VITE_DEV_SERVER_URL must be removed from .env (see setup step) —
    # otherwise autoConfigureInertiaAssets falls back to dev mode.
    # The blog app also disables Secure cookies when CI is set (HTTP, not HTTPS).
    services:
      postgres:
        image: postgres:17-alpine
        ports:
          - 54322:5432
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://guren:guren@localhost:54322/guren
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun and build packages
        uses: ./.github/actions/setup-and-build

      - name: Generate route types
        run: bun run build:routes

      - name: Build blog frontend
        run: bun run --cwd examples/blog build

      # Keyed on the resolved Playwright version, not a hashed manifest: the
      # caret range in examples/blog/package.json means a lockfile-only bump
      # must invalidate this cache, and an unrelated dependency bump must not.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(cd examples/blog && bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: cd examples/blog && bunx playwright install --with-deps chromium

      # On a hit the browsers are already in place and the runner image ships
      # Chromium's system libraries; a plain install is a fast no-op safety
      # net that skips the ~30s apt work --with-deps would repeat.
      - name: Install Playwright browsers (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: cd examples/blog && bunx playwright install chromium

      - name: Set up blog .env
        run: |
          cp examples/blog/.env.example examples/blog/.env
          sed -i "s/^APP_KEY=$/APP_KEY=$APP_KEY/" examples/blog/.env
          sed -i "/^VITE_DEV_SERVER_URL=/d" examples/blog/.env

      - name: Run migrations and seed
        working-directory: examples/blog
        run: |
          bun ../../packages/cli/src/bin.ts db:migrate
          bun ../../packages/cli/src/bin.ts db:seed --force

      - name: Run E2E tests
        env:
          NODE_ENV: production
        run: bun run --cwd examples/blog e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/blog/playwright-report/
          retention-days: 7

  web-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun and build packages
        uses: ./.github/actions/setup-and-build

      - name: Generate route types
        run: |
          bun run --cwd web routes:types
          git diff --exit-code -- web/types/generated/routes.d.ts

      - name: Type check
        run: bun run --cwd web typecheck

      - name: Run tests
        run: bun run --cwd web test

      - name: Build client and SSR
        run: bun run --cwd web build

      - name: Bundle budget audit
        run: bun run ./scripts/smoke/build-budget.ts --max-kb 600 web

      - name: Assemble Cloudflare worker
        run: cd web && bun scripts/cloudflare-build.ts
