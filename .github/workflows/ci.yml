name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      - name: Core-first audit
        run: bun run audit:core-first

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      - name: Docs audit
        run: bun run audit:docs

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      - name: Fresh app smoke
        run: bun run smoke:starter

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      - name: Run tests
        run: bun run test

  web-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: |
          bun run --cwd web routes:types
          git diff --exit-code -- web/types/generated/routes.d.ts

      - name: Type check
        run: bun run --cwd web typecheck

      - name: Run tests
        run: bun run --cwd web test

      - name: Build client and SSR
        run: bun run --cwd web build

      - name: Bundle budget audit
        run: bun run ./scripts/smoke/build-budget.ts web
