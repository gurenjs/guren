name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.3.11']
        include:
          - bun-version: '1.3.11'
            redis: true
          # When a new Bun version is supported, add it here:
          # - bun-version: '1.4.x'
          #   redis: true
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      - name: Core-first audit
        run: bun run audit:core-first

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      - name: Docs audit
        run: bun run audit:docs

      - name: Build example apps
        run: |
          bun run --cwd examples/blog build
          bun run --cwd web build

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      - name: Fresh app smoke
        run: bun run smoke:starter

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      - name: Upgrade existing app smoke
        run: bun run smoke:upgrade-existing-app

      - name: Golden path smoke test
        run: bun run smoke:golden-path

      - name: Run tests
        run: bun run test

  sqlite-smoke:
    runs-on: ubuntu-latest
    # No redis service — verifies all tests gracefully skip when Redis is unavailable
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - name: Run tests (no Redis)
        run: bun run test:bun

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 54322:5432
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://guren:guren@localhost:54322/guren

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Install Playwright browsers
        run: bunx --cwd examples/blog playwright install --with-deps chromium

      - name: Run migrations and seed
        run: |
          bun run db:migrate
          bun run db:seed --force

      - name: Run E2E tests
        run: bun run --cwd examples/blog e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: examples/blog/playwright-report/
          retention-days: 7

  web-app:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: |
          bun run --cwd web routes:types
          git diff --exit-code -- web/types/generated/routes.d.ts

      - name: Type check
        run: bun run --cwd web typecheck

      - name: Run tests
        run: bun run --cwd web test

      - name: Build client and SSR
        run: bun run --cwd web build

      - name: Bundle budget audit
        run: bun run ./scripts/smoke/build-budget.ts --max-kb 600 web
