name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly full scan: query packs update independently of our commits,
    # so a quiet week can still surface new findings.
    - cron: '0 3 * * 1'

# Superseded runs of the same PR are cancelled; pushes to main always run to
# completion (each gets its own group via the commit SHA), and scheduled runs
# queue rather than cancel.
concurrency:
  group: codeql-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended trades some noise for coverage of the
          # injection/path-traversal classes a web framework must care about.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
