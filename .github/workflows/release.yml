name: Release Publish

on:
  release:
    types:
      - published

jobs:
  validate:
    runs-on: ubuntu-latest
    # Measured max 6m30s over 15 releases. Deliberately looser than CI's
    # caps: this job legitimately runs the scaffolding smokes, and a
    # release cut short by a tight cap costs more than a wedged runner.
    timeout-minutes: 45
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guren
          POSTGRES_PASSWORD: guren
          POSTGRES_DB: guren
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U guren"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match the first version in ci.yml's matrix, which is what every
      # pull request is tested on — a release gate running a different Bun is a
      # gate a green CI does not predict. `scripts/workflow-bun-version.test.ts`
      # holds every workflow to that.
      # To test against multiple versions, add a matrix to this job.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node for npm publish
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      - name: Core-first audit
        run: bun run audit:core-first

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      - name: Docs audit
        run: bun run audit:docs

      - name: Dependency audit
        run: bun run audit:deps

      - name: Build example apps
        run: |
          bun run --cwd examples/blog build
          bun run --cwd web build

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      - name: Fresh app smoke
        run: bun run smoke:starter

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      # Boots a scaffolded app (vendored dists) and drives login + CRUD +
      # CSRF over HTTP. Catches published-artifact-only breakage that
      # compile-time smokes cannot see (bundled ORM copies, missing
      # export map entries, unregistered routes).
      - name: Golden path runtime smoke
        run: bun run smoke:golden-path

      - name: Golden path runtime smoke (postgres)
        run: bun run smoke:golden-path:postgres

      # upgrade-existing-app smoke skipped here: it installs the workspace
      # packages from local paths, which the release workflow's published
      # artifacts are meant to supersede. It resolves versions from a fixture
      # rather than npm, so the old chicken-and-egg reason no longer applies —
      # it runs in the nightly canary workflow.

      - name: Run tests
        run: bun run test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: write belongs to this job only. It lets every step of the job
    # request an OIDC token for this workflow, the credential npm trusted
    # publishing accepts, and validate's smokes run dependencies that
    # `bun install` resolves without a lockfile.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node for npm publish
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: bun run release
