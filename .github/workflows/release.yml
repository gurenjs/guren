name: Release Publish

on:
  release:
    types:
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Bun version is centralized here for easy updates.
      # To test against multiple versions, convert the publish job
      # into a validate + publish split with a matrix on validate.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Generate route types
        run: bun run build:routes

      - name: Type check
        run: bun run typecheck

      - name: Core-first audit
        run: bun run audit:core-first

      - name: Contract audit
        run: bun run audit:contracts

      - name: Feature runtime audit
        run: bun run audit:feature-runtime

      - name: Starter template audit
        run: bun run audit:starter-template

      - name: Docs audit
        run: bun run audit:docs

      - name: Build example apps
        run: |
          bun run --cwd examples/blog build
          bun run --cwd web build

      - name: Bundle budget audit
        run: bun run audit:bundle-budgets

      - name: Fresh app smoke
        run: bun run smoke:starter

      - name: Packed artifact audit
        run: bun run smoke:starter:packed

      # Boots a scaffolded app (vendored dists) and drives login + CRUD +
      # CSRF over HTTP. Catches published-artifact-only breakage that
      # compile-time smokes cannot see (bundled ORM copies, missing
      # export map entries, unregistered routes).
      - name: Golden path runtime smoke
        run: bun run smoke:golden-path

      # upgrade-existing-app smoke skipped in release workflow: it tries to
      # resolve the new version from npm before publish, causing a chicken-and-egg
      # failure. This smoke runs in CI on every PR instead.

      - name: Run tests
        run: bun run test

      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: bun run release
