name: Published Package Drift

# Scaffolds a starter app and installs its @guren/* dependencies from npm
# instead of from this checkout, then typechecks it. Every other smoke mode
# (`smoke:starter`, `smoke:starter:packed`) rewrites those dependencies to
# local builds, so none of them can see a template that has started using an
# API which only exists in the repository.
#
# This deliberately lives outside ci.yml and nightly-canary.yml. It is expected
# to be red between a template-facing change and the release that publishes
# what the template needs, and it must not be able to block a PR or turn the
# canary red for a reason that has nothing to do with the night's commits.
# A red run means: apps scaffolded from the current templates do not build
# against what is on npm right now — usually "cut the release".

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # `worker` is absent for the same reason fresh-app.ts skips its typecheck:
      # the worker scaffold has a named-vs-default export mismatch, so the step
      # this workflow exists to run would fail for an unrelated reason.
      matrix:
        smoke: [smoke:starter:npm, smoke:starter:npm:api, smoke:starter:npm:blog]
    env:
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # The scaffolder itself runs from source and needs the workspace's own
      # dependencies. There is no `bun run build` step on purpose: npm mode
      # touches no build output of this checkout, since the app under test has
      # to resolve everything from the registry.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.smoke }}
        run: bun run ${{ matrix.smoke }}

  # gurenjs/agent-skills is published by a maintainer running
  # `bun run publish:agent-catalog` after a release (RFC 0011). The one thing
  # a manual step lacks is a reminder that it was skipped; this is it. Renders
  # the catalog from this checkout and diffs it against what the public repo
  # currently serves. Read-only, no token. Red means "run publish:agent-catalog"
  # — or, between a catalog-source change and the release that carries it, red
  # is expected, the same way the npm drift above is.
  agent-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Diff the rendered catalog against gurenjs/agent-skills
        run: bun run ./scripts/build-agent-catalog.ts --diff-published
